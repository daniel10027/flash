[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flash"
version = "0.1.0"
description = "Flash — plateforme de monnaie électronique (API + cœur métier)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "redis>=5.0",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "qrcode[pil]>=7.4",
    "click>=8.1",
    "uuid7>=0.1.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
    "types-redis",
    "schemathesis>=3.33",
    "locust>=2.29",
]

[project.scripts]
flash = "flash.interface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: nécessite des services externes (PostgreSQL via FLASH_TEST_DATABASE_URL)",
    "contract: tests de contrat OpenAPI (schemathesis) — plus lents",
]

[tool.coverage.run]
source = ["flash.domain", "flash.application"]
branch = true
omit = [
    # Déclarations de ports : uniquement des Protocol/typing, aucune logique exécutable.
    "src/flash/domain/shared/ports.py",
    "src/flash/domain/*/ports.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["N818"]  # les erreurs de domaine ne se terminent pas par "Error" volontairement

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"flask".msg = "Interdit dans domain/ et application/ — couche interface uniquement."
"sqlalchemy".msg = "Interdit dans domain/ et application/ — couche infrastructure uniquement."

[tool.ruff.lint.per-file-ignores]
"src/flash/infrastructure/**" = ["TID251"]
"src/flash/interface/**" = ["TID251"]
"tests/**" = ["TID251", "B011"]
"loadtest/**" = ["TID251"]  # script d'ops : accès direct SQLAlchemy / secret admis

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["flash"]
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["qrcode.*", "uuid_extensions.*", "uuid7.*"]
ignore_missing_imports = true
