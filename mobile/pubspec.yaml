name: flash_app
description: "Flash — envoyez, payez, épargnez."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Réseau
  dio: ^5.7.0

  # Stockage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Sécurité / biométrie
  local_auth: ^2.3.0

  # UI / animations
  flutter_animate: ^4.5.2
  liquid_swipe: ^3.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16

  # Fonctions
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_native_splash:
  color: "#8c1d33"
  color_dark: "#161619"
  android_12:
    color: "#8c1d33"
    color_dark: "#161619"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#8c1d33"
  adaptive_icon_foreground: "assets/icon_foreground.png"
