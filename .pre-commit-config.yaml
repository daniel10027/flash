# INFRA-012 — hooks pré-commit. Installation :
#   pipx install pre-commit   (ou pip install --user pre-commit)
#   pre-commit install
#   pre-commit run --all-files      # première passe
#
# CI : le workflow backend/web relance ruff / eslint ; ces hooks servent la
# boucle locale. detect-secrets s'appuie sur .secrets.baseline (régénérer avec
#   detect-secrets scan > .secrets.baseline).

default_install_hook_types: [pre-commit]
exclude: |
  (?x)^(
    docs/api/openapi\.json|
    web/src/shared/api/schema\.d\.ts|
    .*\.min\.(js|css)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: ruff (backend)
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        name: ruff-format (backend)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^web/.*\.(ts|tsx|js|cjs|mjs|json|css|html|md)$

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint
        files: (^|/)Dockerfile$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Les IDs de révision Alembic sont de l'entropie légitime.
        exclude: ^backend/alembic/versions/
