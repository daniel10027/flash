name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flash
          POSTGRES_PASSWORD: flash
          POSTGRES_DB: flash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flash -d flash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Tests d'intégration (Postgres réel) + tests de migrations Alembic.
      FLASH_TEST_DATABASE_URL: postgresql+psycopg://flash:flash@localhost:5432/flash_test
      DATABASE_URL: postgresql+psycopg://flash:flash@localhost:5432/flash_test
      REDIS_URL: redis://localhost:6379/0
      FLASH_ENV: test
      FLASH_SECRET_KEY: ci-secret-please-ignore-0123456789abcd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: "Tests + couverture (garde-fou BE-T1, fail_under=90)"
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: OpenAPI en phase avec le code
        run: |
          flash openapi dump -o /tmp/openapi.json
          diff -u ../docs/api/openapi.json /tmp/openapi.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
