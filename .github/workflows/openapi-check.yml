name: openapi-check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/api/openapi.json"
      - ".github/workflows/openapi-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/api/openapi.json"
      - ".github/workflows/openapi-check.yml"

concurrency:
  group: openapi-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-in-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"

      - name: "openapi.json = source de vérité"
        run: |
          flash openapi dump -o /tmp/openapi.json
          if ! diff -u ../docs/api/openapi.json /tmp/openapi.json; then
            echo "::error::docs/api/openapi.json est périmé — lance 'make openapi' et committe."
            exit 1
          fi

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flash
          POSTGRES_PASSWORD: flash
          POSTGRES_DB: flash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flash -d flash_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FLASH_TEST_DATABASE_URL: postgresql+psycopg://flash:flash@localhost:5432/flash_test
      DATABASE_URL: postgresql+psycopg://flash:flash@localhost:5432/flash_test
      REDIS_URL: redis://localhost:6379/0
      FLASH_ENV: test
      FLASH_SECRET_KEY: ci-secret-please-ignore-0123456789abcd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"

      - name: "Contrats OpenAPI (schemathesis)"
        run: pytest -m contract -q
