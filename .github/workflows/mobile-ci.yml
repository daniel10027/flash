name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version épinglée (reproductibilité : lints / format figés).
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique
        run: flutter analyze

      - name: "Tests (widget + provider + golden)"
        run: flutter test --coverage --exclude-tags golden --reporter expanded

      - name: Build APK debug
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-android-debug
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore
