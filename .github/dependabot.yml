version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      js-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories:
      - /backend
      - /web
      - /infra/deploy/caddy
      - /infra/deploy/backup
    schedule: { interval: weekly }
