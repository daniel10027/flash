# INFRA-022/023 — pile d'observabilité optionnelle, à superposer à la prod :
#
#   docker compose \
#     -f infra/deploy/docker-compose.prod.yml \
#     -f infra/observability/docker-compose.observability.yml \
#     --env-file /etc/flash/flash.env --profile observability up -d
#
# Tout est sur le réseau interne ; l'accès Grafana passe par Caddy (ajouter un
# vhost `metrics.$DOMAIN` protégé par basicauth) ou un tunnel SSH.

name: ${COMPOSE_PROJECT_NAME:-flash}

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
    mem_limit: 256m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    mem_limit: 64m

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 256m

  promtail:
    image: grafana/promtail:3.1.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://metrics.${DOMAIN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 192m

volumes:
  prom_data:
  loki_data:
  grafana_data:
