<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 420" font-family="Inter, system-ui, sans-serif">
  <title>Flash — modèle de reçu</title>
  <rect width="592" height="420" fill="#ffffff"/>
  <rect x="0" y="0" width="592" height="6" fill="#8c1d33"/>

  <path transform="translate(40 34) scale(0.6)" fill="#8c1d33"
    d="M38.5 6 L17 33.4a2 2 0 0 0 1.6 3.2H28.4L24.6 55a1 1 0 0 0 1.8.8L48 28.6a2 2 0 0 0-1.6-3.2H37.1L40.3 7a1 1 0 0 0-1.8-.8Z"/>
  <text x="70" y="52" font-size="22" font-weight="800" letter-spacing="-.5" fill="#8c1d33">Flash</text>
  <rect x="470" y="34" width="82" height="24" rx="12" fill="#e6f4ea"/>
  <text x="511" y="50" font-size="11" font-weight="700" fill="#0c7a3f" text-anchor="middle">COMPLÉTÉ</text>

  <text x="40" y="120" font-size="34" font-weight="800" fill="#26262c">{{amount}}</text>
  <text x="40" y="144" font-size="13" fill="#727282">{{operation_label}} · {{date}}</text>

  <g font-size="13">
    <text x="40"  y="220" fill="#727282">Référence</text><text x="552" y="220" text-anchor="end">{{reference}}</text>
    <text x="40"  y="248" fill="#727282">De</text>       <text x="552" y="248" text-anchor="end">{{sender}}</text>
    <text x="40"  y="276" fill="#727282">Vers</text>     <text x="552" y="276" text-anchor="end">{{recipient}}</text>
    <text x="40"  y="304" fill="#727282">Frais</text>    <text x="552" y="304" text-anchor="end">{{fee}}</text>
    <text x="40"  y="332" fill="#727282">Total</text>    <text x="552" y="332" text-anchor="end" font-weight="700">{{total}}</text>
  </g>

  <rect x="40" y="356" width="48" height="48" fill="#ededf0"/>
  <text x="100" y="376" font-size="10" fill="#9a9aa6">Vérifiez ce reçu sur flash.app/v/{{reference}}</text>
  <text x="100" y="392" font-size="10" fill="#9a9aa6">Émis par Flash — reçu non contractuel.</text>
</svg>
